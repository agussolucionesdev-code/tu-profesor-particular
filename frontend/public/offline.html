<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión | Tu Profesor Particular</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      min-height:100dvh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(160deg,#eef3f9 0%,#dce6f0 100%);
      color:#204060;padding:1.5rem;
    }
    .container{text-align:center;max-width:420px}
    svg{width:160px;height:160px;margin-bottom:1.5rem;opacity:.85}
    h1{font-size:1.75rem;font-weight:700;margin-bottom:.5rem}
    p{font-size:1.05rem;color:#4a6a8a;line-height:1.5;margin-bottom:1.5rem}
    button{
      display:inline-flex;align-items:center;gap:.5rem;
      padding:.75rem 1.75rem;border:none;border-radius:12px;
      background:#204060;color:#fff;font-size:1rem;font-weight:600;
      cursor:pointer;transition:transform .15s,box-shadow .15s;
    }
    button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(32,64,96,.25)}
    button:active{transform:translateY(0)}
    @media(prefers-color-scheme:dark){
      body{background:linear-gradient(160deg,#0f172a 0%,#162032 100%);color:#e2e8f0}
      p{color:#94a3b8}
      button{background:#589860;color:#fff}
    }
    @media(prefers-reduced-motion:reduce){
      button{transition:none}
    }
  </style>
</head>
<body>
  <div class="container">
    <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="80" cy="80" r="70" stroke="currentColor" stroke-width="1.5" opacity=".1" />
      <path d="M50 75c0-16.57 13.43-30 30-30s30 13.43 30 30" stroke="#589860" stroke-width="3" stroke-linecap="round" opacity=".5"/>
      <path d="M60 80c0-11.05 8.95-20 20-20s20 8.95 20 20" stroke="#589860" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      <path d="M70 85c0-5.52 4.48-10 10-10s10 4.48 10 10" stroke="#589860" stroke-width="3" stroke-linecap="round"/>
      <circle cx="80" cy="90" r="4" fill="#589860"/>
      <line x1="65" y1="65" x2="95" y2="95" stroke="#204060" stroke-width="3" stroke-linecap="round"/>
      <line x1="95" y1="65" x2="65" y2="95" stroke="#204060" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>Revisá tu conexión a internet y recargá la página para continuar.</p>
    <button onclick="location.reload()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M14 8A6 6 0 1 1 2.34 5.74l-.76-.65A7 7 0 1 0 15 8h-1z"/><path d="M2 1v4h4L2 1z"/></svg>
      Reintentar
    </button>
  </div>
</body>
</html>
