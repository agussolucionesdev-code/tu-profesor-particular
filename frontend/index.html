<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Azul del logo. Era #204060, que no sale de la marca; en Chrome de
         Android pinta la barra de direcciones. -->
    <meta name="theme-color" content="#00214c" />
    <meta name="color-scheme" content="light dark" />
    <!-- Fija el tema antes de pintar: sin esto, con el sistema en oscuro, la
         página aparecía blanca un instante. Archivo y no en línea porque la
         CSP es script-src 'self'. Sincrónico a propósito: sin defer ni async. -->
    <script src="/tema.js"></script>

    <!-- Íconos del logo nuevo, versión OSCURA (el sitio principal usa la clara:
         con las dos pestañas abiertas se distinguen). Salen de
         scripts/generar-iconos.mjs. Antes era el «TU» viejo en un PNG de 733 KB. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Apuntaba a la portada del sitio institucional. Como este <head> lo
         comparten todas las rutas de la SPA, turnos entero se declaraba
         duplicado de la landing. Al navegar, usePageMeta lo reemplaza por la
         URL de cada ruta. -->
    <link rel="canonical" href="https://turnos.tuprofesorparticular.com.ar/" />

    <meta name="robots" content="index, follow" />
    <meta name="author" content="Agustín Elías Sosa" />
    <link rel="preconnect" href="https://tu-profesor-particular-backend.onrender.com" />
    <meta
      name="description"
      content="Reservá una clase con Agustín Elías Sosa. Elegí materia, modalidad y horario, revisá el precio y confirmá tu turno online o presencial en Temperley."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://turnos.tuprofesorparticular.com.ar/" />
    <meta property="og:site_name" content="Tu Profesor Particular" />
    <meta property="og:title" content="Tu Profesor Particular | Agustín Elías Sosa" />
    <meta
      property="og:description"
      content="Reservá, consultá, reprogramá y gestioná turnos de clases particulares en pocos pasos."
    />
    <!-- En ESTE dominio: apuntaba a tuprofesorparticular.com.ar/logo-full.png,
         que no existe (404), y los enlaces a turnos se compartían sin imagen. -->
    <meta property="og:image" content="https://turnos.tuprofesorparticular.com.ar/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tu Profesor Particular · Agustín Elías Sosa" />
    <meta property="og:locale" content="es_AR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tu Profesor Particular | Agustín Elías Sosa" />
    <meta
      name="twitter:description"
      content="Reservá clases particulares con orden, claridad y seguimiento."
    />
    <meta name="twitter:image" content="https://turnos.tuprofesorparticular.com.ar/og-cover.jpg" />

    <title>Tu Profesor Particular | Agustín Elías Sosa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
