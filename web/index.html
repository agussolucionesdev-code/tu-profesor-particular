<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Íconos del logo nuevo, versión CLARA (turnos usa la oscura: con las dos
         pestañas abiertas se distinguen). Salen de
         frontend/scripts/generar-iconos.mjs. El .ico de 48 px es el que Google
         muestra junto al resultado de búsqueda. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Tu Profesor Particular · Agustín Elías Sosa | Clases particulares en Temperley y online</title>
    <meta
      name="description"
      content="Clases particulares de Matemáticas, Física, Fisicoquímica, Química e Inglés. Online y presenciales en Temperley, Buenos Aires. Desde primaria hasta universitario. Sin pagos por adelantado."
    />
    <meta name="theme-color" content="#00214c" />
    <meta name="color-scheme" content="light dark" />
    <!-- Fija el tema antes de pintar: sin esto, quien eligió oscuro vería la
         página blanca un instante. Archivo y no en línea porque la CSP es
         script-src 'self'. Sincrónico a propósito: sin defer ni async. -->
    <script src="/tema.js"></script>
    <link rel="canonical" href="https://tuprofesorparticular.com.ar/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Tu Profesor Particular" />
    <meta
      property="og:title"
      content="Tu Profesor Particular · Agustín Elías Sosa"
    />
    <meta
      property="og:description"
      content="Entendé de verdad, no de memoria. Clases particulares online y presenciales en Temperley."
    />
    <meta property="og:url" content="https://tuprofesorparticular.com.ar/" />
    <!--
      La imagen de la vista previa va acá, en el HTML servido, y no sólo desde
      React: los bots de WhatsApp, Facebook, Instagram y LinkedIn no ejecutan
      JavaScript. Sin esto, cada enlace compartido salía sin imagen —y el canal
      principal de este negocio es justamente WhatsApp.
      Absoluta y con dimensiones: WhatsApp descarta las relativas, y sin el
      tamaño declarado muestra la tarjeta chica hasta terminar de bajarla.
    -->
    <meta property="og:image" content="https://tuprofesorparticular.com.ar/og-cover.jpg" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Tu Profesor Particular · Agustín Elías Sosa" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tu Profesor Particular · Agustín Elías Sosa" />
    <meta
      name="twitter:description"
      content="Entendé de verdad, no de memoria. Clases particulares online y presenciales en Temperley."
    />
    <meta name="twitter:image" content="https://tuprofesorparticular.com.ar/og-cover.jpg" />

    <!-- El destino de todos los CTA: adelantar el handshake ahorra ~200 ms
         cuando la persona finalmente toca "Reservar". -->
    <link rel="preconnect" href="https://turnos.tuprofesorparticular.com.ar" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
