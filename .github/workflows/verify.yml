name: Verificar

# Corre lint y tests en cada PR y en cada push a main.
#
# Antes de esto el único workflow del repo era el de deploy: cada push a main
# llegaba a producción sin que nada lo revisara. Los tests existían —313 en el
# backend, 110 en el frontend— y no los corría nadie salvo a mano.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un PR que recibe varios pushes seguidos cancela las corridas viejas: no tiene
# sentido gastar minutos verificando un commit que ya quedó atrás.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # El backend levanta un mongodb-memory-server y la suite completa tarda
    # ~3 minutos; el default de 6 h no protege de nada si algo se cuelga.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Antes de los tests: el lint tarda segundos y la suite tres minutos, así
      # que un error de sintaxis o una variable muerta se ven enseguida en vez
      # de después de levantar un mongodb-memory-server.
      # El backend era el único de los tres proyectos sin linter, justamente el
      # que maneja las reservas y los precios. La primera corrida encontró nueve
      # cosas, y tres eran `catch` que registraban un fallo sin decir la causa.
      - run: npm run lint
      # Buenos Aires, igual que producción. Sin esto el runner corre en UTC y
      # los tests que arman horarios de atención se corren tres horas.
      - run: npm test
        env:
          TZ: America/Argentina/Buenos_Aires

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `npm test` corre los dos grupos: los 98 unitarios con el runner de Node
      # y los 12 de componentes con Vitest. Son runners distintos.
      - run: npm test
        env:
          TZ: America/Argentina/Buenos_Aires
      # Que compile es parte de la verificación: un import roto no lo detecta
      # ni el lint ni los tests.
      - run: npm run build

  web:
    name: Sitio institucional
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Los tests de `web/` protegen sobre todo los LÍMITES de lo publicable: que no
      # salga a la web ningún dato que identifique a una alumna menor, ni lo que
      # Agustín pidió dejar afuera. Van ANTES del build a propósito: si algo de eso se
      # filtró, no hay que desplegar.
      - run: npm test
      - run: npm run build

  accesibilidad:
    name: Accesibilidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Sólo Chromium: el objetivo es medir contraste y tamaños calculados, que
      # no cambian entre motores. Instalar los tres triplica el minuto de CI sin
      # agregar señal.
      - run: npx playwright install --with-deps chromium
      # Los tres specs de accesibilidad, y sólo esos. El resto de `tests/e2e/`
      # necesita el backend vivo; estos se apoyan en `_backendFalso.js`, que
      # simula el health-check —sin él todo lo que no sea `/` mide la pantalla de
      # mantenimiento y pasa por no haber mirado la página real—. Los dos casos
      # que sí necesitan disponibilidad real se saltean solos, con el motivo a la
      # vista en el informe.
      # canonical.spec.js va acá porque también necesita el navegador: el canonical
      # lo reescribe un efecto de React al cambiar de ruta.
      - run: npx playwright test tests/e2e/axe.spec.js tests/e2e/contraste.spec.js tests/e2e/blancos-tactiles.spec.js tests/e2e/canonical.spec.js --project=desktop
        env:
          TZ: America/Argentina/Buenos_Aires
      # El menú de celular va aparte y en el proyecto `mobile`: su bug sólo
      # existe en esa vista. El panel quedaba recortado dentro de la barra
      # —`backdrop-filter` + `overflow: hidden`— y abrir el menú no mostraba
      # nada. Ningún test sin layout podía verlo: el DOM decía que estaba
      # abierto y visible.
      # Los dos modales del portal van en el mismo proyecto y por el mismo motivo:
      # blancos táctiles, desborde y foco sólo existen con layout. En jsdom los
      # dos pasan cualquier test —el DOM dice que están abiertos y visibles—.
      - run: npx playwright test tests/e2e/menu-mobile.spec.js tests/e2e/modales-portal.spec.js tests/e2e/materias-reparto.spec.js --project=mobile
        env:
          TZ: America/Argentina/Buenos_Aires
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-accesibilidad
          path: frontend/test-results/
          retention-days: 7
